name: Upstream

# Only on pushes to main, tags, or workflow dispatches
on:
  push:
    branches:
    - main
    - dev
    paths:
      # Only run test and docker publish if some code have changed
      - 'src/titiler/xarray/**'
  workflow_dispatch:

jobs:
  test-upstream:
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.*" 
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Test titiler.xarray
        working-directory: src/titiler/xarray
        run: |
          uv run --group test --with-requirements requirements-upstream.txt pytest
