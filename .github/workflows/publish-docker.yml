name: Publish Docker image

on:
  release:
    types: [published]
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  # A multi-platform build can't be loaded into the local Docker daemon (the
  # docker exporter doesn't support manifest lists), so each platform is
  # built, loaded and scanned separately - one matrix cell per (image,
  # platform) pair. Trivy itself can't scan a multi-platform image/index in
  # one pass either
  # (https://github.com/aquasecurity/trivy/discussions/6122,
  # https://github.com/aquasecurity/trivy/issues/3571), which is the other
  # reason this can't be collapsed back into a single multi-platform build.
  build-and-scan:
    name: build-and-scan (${{ matrix.target.name }}, ${{ matrix.platform.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # Persist Docker layer cache for docker/build-push-action (type=gha).
      security-events: write # Upload Trivy SARIF to the GitHub Security tab.
    strategy:
      fail-fast: false
      matrix:
        target:
          - image: ghcr.io/${{ github.repository }}
            file: dockerfiles/Dockerfile
            name: main
          # TODO: Remove this for titiler 3.0
          - image: ghcr.io/${{ github.repository }}-xarray
            file: dockerfiles/Dockerfile.xarray
            name: xarray
        platform:
          - name: amd64
            tag: linux/amd64
          - name: arm64
            tag: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.target.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Scanned by image ID rather than by tag: every tag above points at
      # this ID, and it does not depend on the order metadata-action emits
      # tags in.
      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: ${{ matrix.platform.tag }}
          context: .
          file: ${{ matrix.target.file }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target.name }}-${{ matrix.platform.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}-${{ matrix.platform.name }}

      - name: Scan image with Trivy (SARIF CRITICAL/HIGH, incl. unfixed)
        id: trivy-sarif-critical-high
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: sarif
          output: trivy-results-critical-high.sarif
          exit-code: '0'
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Warn on fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH

      - name: Upload Trivy SARIF (CRITICAL/HIGH) to GitHub Security tab
        if: steps.trivy-sarif-critical-high.outcome == 'success'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results-critical-high.sarif
          category: trivy-critical-high-${{ matrix.target.name }}-${{ matrix.platform.name }}

  # Runs only once every (image, platform) cell above has been scanned clean.
  # NOTE: this waits on the *entire* build-and-scan job, so e.g. a Trivy
  # failure on titiler-xarray currently blocks publishing titiler too, even
  # though the two images are otherwise independent - say if you'd rather
  # keep them fully decoupled and want that split out.
  push:
    name: push (${{ matrix.name }})
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Push multi-arch images to ghcr.io for this repository
    strategy:
      matrix:
        include:
          - image: ghcr.io/${{ github.repository }}
            file: dockerfiles/Dockerfile
            name: main
          # TODO: Remove this for titiler 3.0
          - image: ghcr.io/${{ github.repository }}-xarray
            file: dockerfiles/Dockerfile.xarray
            name: xarray
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Rebuilds from the same cache as the two scanned platforms above (all
      # layers are already warm, so this is a cache hit, not a real rebuild)
      # and pushes the result as one multi-arch manifest list.
      - name: Push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.name }}-amd64
            type=gha,scope=${{ matrix.name }}-arm64
